<!doctype html>
<html><head><meta charset="utf-8"><title>a walk never loses its audio</title></head>
<body style="font:16px monospace;background:#111;color:#eee;padding:20px">
<!--
  The owner's report, 2026-09-13, and the first reliable repro anyone has had:
  start a walk, leave the app to another app mid-recording, come back, finish
  it — and Recordings says there is no audio. A walk recorded without ever
  leaving the app plays back fine.

  Two earlier sessions guessed at this and both guessed wrong, because both
  tested the wrong thing: short walks, and the size check on an interrupted
  walk. Neither tested backgrounding.

  What this harness pins is the mechanism that was found by reading the code
  with that repro in hand: `endSession` used to DELETE the ten-second chunks
  and then WRITE the assembled blob. Between those two steps the whole walk
  existed only in memory, and a backgrounded iOS tab is precisely the thing
  that gets killed in a window like that.

  The fix is an ordering swap — write, then delete — so no instant exists at
  which the audio is only in memory.

  Section D is the one that actually catches it. A to C pass against the old
  order too, because none of them kills the page inside the window, and the
  wrong order still reaches the right answer when nothing interrupts it. D
  makes the assembled write fail, which is what a kill looks like from the
  database side, and only the new order survives that.

  Run with the dev server up:
    http://localhost:5173/check/browser/audio-durability.html

  It cleans up after itself. Browser harnesses write into the real database
  (see the trap in NEXT_SESSION_HANDOFF.md); every session this file creates
  is deleted at the end, and it reports what it removed.
-->
<pre id="out">running…</pre>
<script type="module">
const out = document.getElementById('out');
const log = (m) => { out.textContent += '\n' + m; };
out.textContent = 'start';
let fails = 0;
const check = (name, got, want) => {
  const ok = JSON.stringify(got) === JSON.stringify(want);
  if (!ok) fails++;
  log(`${ok ? 'PASS' : 'FAIL'} ${name}` + (ok ? '' : `\n  got  ${JSON.stringify(got)}\n  want ${JSON.stringify(want)}`));
};

// `visibilitychange` cannot be fired with a real hidden state, so the state is
// stubbed and the event dispatched — what the browser does, minus the actual
// backgrounding. Same approach as backgrounded.html.
let visibility = 'visible';
Object.defineProperty(document, 'visibilityState', { get: () => visibility, configurable: true });
const setVisibility = (v) => { visibility = v; document.dispatchEvent(new Event('visibilitychange')); };

// A tone, so the harness never needs a real microphone.
//
// A FRESH stream per call, deliberately. Ending a walk stops every track on
// the stream it was given, so handing the same one out twice makes the second
// `MediaRecorder.start()` fail with NotSupportedError — which is a fault in
// the harness, not the app, and cost a run here before it was spotted.
const ctx = new AudioContext();
let lastStream = null;
navigator.mediaDevices.getUserMedia = async () => {
  const osc = ctx.createOscillator();
  const dest = ctx.createMediaStreamDestination();
  osc.connect(dest);
  osc.start();
  lastStream = dest.stream;
  return lastStream;
};

const R = await import('/src/capture/recording.ts');
const { openDeezPlants } = await import('/src/db/schema.ts');
const db = await openDeezPlants();

const made = [];
const audioKeys = async (id) =>
  (await db.getAllKeys('audio')).filter((k) => typeof k === 'string' && k.startsWith(id));
const chunkKeys = async (id) => (await audioKeys(id)).filter((k) => k.includes('#'));
const wait = (ms) => new Promise((r) => setTimeout(r, ms));

/* -- A: the contract of the tidy-up itself ------------------------------- */

{
  const id = 'HARNESS-A';
  await db.put('audio', new Blob(['whole'], { type: 'audio/mp4' }), id);
  await db.put('audio', new Blob(['part'], { type: 'audio/mp4' }), `${id}#0000`);
  await db.put('audio', new Blob(['part'], { type: 'audio/mp4' }), `${id}#0001`);

  // keepWhole is what `endSession` uses once the assembled blob is safely
  // written. It must drop the pieces and never the walk.
  await R.deleteSessionAudio(db, id, { keepWhole: true });
  check('keepWhole keeps the assembled walk', !!(await db.get('audio', id)), true);
  check('keepWhole drops the chunks', await chunkKeys(id), []);

  // Without it, "delete" means what it says.
  await R.deleteSessionAudio(db, id);
  check('a plain delete leaves nothing', await audioKeys(id), []);
}

/* -- B: an ordinary walk ------------------------------------------------- */

{
  await R.startSession('2026-09-13');
  const started = R.getSnapshot();
  made.push(started.session_id);
  await wait(1200);
  const id = await R.endSession();
  check('a walk ends with an id', typeof id === 'string' && id.length > 0, true);

  const whole = await db.get('audio', id);
  check('the walk is stored as one assembled blob', !!whole && whole.size > 0, true);
  check('and its chunks have been tidied away', await chunkKeys(id), []);

  const read = await R.readSessionAudio(db, id);
  check('the walk reads back', !!read && read.size > 0, true);
}

/* -- C: the owner's scenario -------------------------------------------- */

{
  // Start a walk, leave the app mid-recording, come back, finish it.
  // The audio must survive all of it. This is the case that was failing.
  await R.startSession('2026-09-13');
  const started = R.getSnapshot();
  const id = started.session_id;
  made.push(id);
  await wait(1200);

  // Backgrounding alone freezes the clock; it does NOT end the capture, and
  // asserting that it does was wrong in an earlier draft of this file. iOS
  // stopping the microphone is a separate signal, and the one the app really
  // listens for is the track's `mute` event (see `attachLifecycle`). So the
  // honest simulation is both, in the order the phone produces them.
  setVisibility('hidden');
  await wait(150);
  check('backgrounding freezes the clock', R.getSnapshot().backgrounded, true);

  for (const t of lastStream.getAudioTracks()) t.dispatchEvent(new Event('mute'));

  // Wait for the app to finish reacting, rather than guessing at a delay. The
  // invariant is "once the interrupt has completed, the audio is on disk" —
  // not "at every instant mid-flight", which nothing could promise.
  for (let i = 0; i < 80 && R.getSnapshot().phase !== 'interrupted'; i++) await wait(100);
  check('losing the mic interrupts the walk', R.getSnapshot().phase, 'interrupted');

  // Whatever was captured up to that instant is the walk, and it must be on
  // disk — not sitting in a write that never landed. This is the assertion
  // the fix exists for.
  const parked = await R.readSessionAudio(db, id);
  check('audio survives being backgrounded', !!parked && parked.size > 0, true);

  setVisibility('visible');
  await wait(300);

  // `resumeInterrupted`, not `resumeSession` — the latter picks up a walk you
  // PAUSED, and calling it here left the walk interrupted and `endSession`
  // returning null. A harness fault, caught because the assembly check failed.
  check('the walk is waiting to be picked up', R.getSnapshot().phase, 'interrupted');
  await R.resumeInterrupted();
  check('it records again', R.getSnapshot().phase, 'recording');
  await wait(900);
  await R.endSession();

  const after = await R.readSessionAudio(db, id);
  check('and survives coming back and finishing', !!after && after.size > 0, true);

  check('the finished walk is assembled, not left in pieces', await chunkKeys(id), []);
  // The real failure the owner saw: Recordings reporting no audio at all.
  check('Recordings would not call this walk silent', after === null, false);
}

/* -- D: the kill itself -------------------------------------------------- */

{
  // Sections A to C all pass against the OLD delete-then-write order, because
  // none of them kills the page inside the window — and without a kill, the
  // wrong order still reaches the right answer. An earlier draft of this file
  // claimed they caught the bug. They did not.
  //
  // THIS is the one that does. The assembled write is made to fail, which is
  // what a killed tab looks like from the database's side: the delete either
  // has or has not already happened.
  //
  //   old order: chunks deleted, then the write fails -> the walk is GONE
  //   new order: the write fails, chunks never deleted -> the walk survives
  //
  // Nothing else in the harness can tell those two apart.
  await R.startSession('2026-09-13');
  const id = R.getSnapshot().session_id;
  made.push(id);
  await wait(1200);

  const realPut = db.put.bind(db);
  db.put = async (store, value, key) => {
    if (store === 'audio' && key === id) throw new Error('simulated kill mid-save');
    return realPut(store, value, key);
  };
  try {
    await R.endSession();
  } finally {
    db.put = realPut;
  }

  const survived = await R.readSessionAudio(db, id);
  check('a walk killed mid-save is still on disk', !!survived && survived.size > 0, true);
  check('because its chunks were never dropped first', (await chunkKeys(id)).length > 0, true);
}

/* -- clean up ------------------------------------------------------------ */

for (const id of made) {
  try { await R.deleteSession(db, id); } catch { /* already gone */ }
}
const leftover = [];
for (const id of made) {
  const s = await db.get('sessions', id);
  if (s) leftover.push(id);
  if ((await audioKeys(id)).length) leftover.push(id + ' (audio)');
}
check('the harness leaves the record as it found it', leftover, []);
log(`\ncleaned up ${made.length} harness session(s)`);

log(fails ? `\n${fails} FAILED` : '\nall passed');
</script>
</body></html>
